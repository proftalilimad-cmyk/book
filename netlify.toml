[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# وسيط RSS → Netlify Function (تجاوز CORS لجلب التغذيات)
[[redirects]]
  from = "/api/rss"
  to = "/.netlify/functions/rss-proxy"
  status = 200

# SPA fallback — كل المسارات توجه إلى index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
